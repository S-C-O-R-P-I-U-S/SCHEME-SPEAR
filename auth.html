<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication & Intake | SCHEME SPEAR (Team SCORPIUS SIH 2026)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0A0E1A] text-white flex flex-col justify-center items-center min-h-screen p-4 font-sans relative overflow-hidden">
  
  <a href="index.html" class="absolute top-6 left-6 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white transition-colors">
    ← Back to SCHEME SPEAR Home
  </a>

  <div class="relative w-full max-w-md rounded-3xl bg-[#0F172A] border border-[#FFB800]/40 p-8 shadow-[0_0_50px_rgba(255,184,0,0.25)] text-white">
    <div class="flex justify-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#FFB800] to-[#00E5CC] p-0.5 shadow-lg">
        <div class="w-full h-full bg-[#0A0E1A] rounded-[14px] flex items-center justify-center">
          <i data-lucide="zap" class="w-7 h-7 text-[#FFB800]"></i>
        </div>
      </div>
    </div>

    <div class="text-center mb-6">
      <span class="px-3 py-1 rounded-full bg-[#FFB800]/10 border border-[#FFB800]/30 text-[#FFB800] text-xs font-mono">
        OFFICIAL PORTAL AUTHENTICATION
      </span>
      <h1 class="text-2xl font-bold font-heading mt-2">SCHEME SPEAR Login</h1>
      <p class="text-xs text-slate-400 mt-1">Team SCORPIUS • Smart India Hackathon 2026 (PS26092)</p>
    </div>

    <div id="auth-container" class="space-y-4">
      <button onclick="loginGoogle()" class="w-full py-4 px-6 rounded-2xl bg-white text-slate-900 font-bold flex items-center justify-center gap-3 shadow-lg hover:bg-slate-100 transition-all cursor-pointer">
        <i data-lucide="mail" class="w-5 h-5 text-rose-500"></i> Continue with Google OAuth
      </button>

      <div class="relative flex py-2 items-center"><div class="flex-grow border-t border-slate-800"></div><span class="flex-shrink mx-4 text-xs text-slate-500 font-mono">OR PHONE OTP (+91)</span><div class="flex-grow border-t border-slate-800"></div></div>

      <form onsubmit="loginPhone(event)" class="space-y-3">
        <div class="flex items-center rounded-2xl bg-slate-900 border border-slate-700 px-4 py-3">
          <span class="text-[#00E5CC] font-bold font-mono mr-2">+91</span>
          <input type="tel" id="auth-phone" placeholder="98765 43210" required maxLength="10" class="bg-transparent text-white outline-none w-full text-sm font-mono">
        </div>
        <button type="submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-[#00E5CC] to-teal-500 text-black font-bold text-xs cursor-pointer shadow-lg">
          Submit & Verify OTP
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function loginGoogle() {
      window.location.href = "index.html";
    }

    function loginPhone(e) {
      e.preventDefault();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
